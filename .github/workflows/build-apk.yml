name: Build AeroBubbles APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack AeroBubbles source
        run: |
          mkdir -p aerobubbles-src
          unzip -q AeroBubbles_Phone_Build_Source.zip -d aerobubbles-src
          test -f aerobubbles-src/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p aerobubbles-src :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroBubbles-APK
          path: aerobubbles-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
