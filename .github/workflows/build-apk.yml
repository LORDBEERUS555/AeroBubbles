name: Build AeroBubbles APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack AeroBubbles project ZIP
        run: |
          mkdir -p aerobubbles-src
          unzip -q AeroBubbles_Phone_Build_Source.zip -d aerobubbles-src
          test -f aerobubbles-src/settings.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and sign debug APK
        run: gradle -p aerobubbles-src :app:assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroBubbles-APK
          path: aerobubbles-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
